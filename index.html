<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek (tips 2021) - Join Now</title>
    <style>
        /* General Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: radial-gradient(circle at top, #004d40 0%, #001a1a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 50px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Profile Image Setup */
        .profile-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            position: relative;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00c853;
            box-shadow: 0 0 15px rgba(0, 200, 83, 0.4);
        }

        h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        
        .tagline { font-size: 14px; color: #cfd8dc; margin-bottom: 35px; line-height: 1.6; }

        .timer { font-size: 16px; margin-bottom: 25px; font-weight: 500; }
        .timer span { color: #00c853; font-weight: 700; font-size: 18px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00c853;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 10px 20px rgba(0, 200, 83, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 35px;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0, 200, 83, 0.5); }

        .disclaimer {
            font-size: 12px;
            color: #90a4ae;
            line-height: 1.6;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-container">
            <!-- Aapki di hui photo yahan linked hai -->
            <img src="IMG_20260513_030325_631.jpg" alt="Abhishek" class="profile-img">
        </div>
        
        <h1>ABHISHEK (TIPS 2021) 🚩</h1>
        <p class="tagline">Honest analysis • Match insights •<br>Community driven</p>

        <div class="timer">FREE JOINING ENDS IN <span id="count">15</span>s</div>

        <!-- Aapka Telegram Link -->
        <a href="https://t.me/+G5-Zgp7n44Q4MjE9" class="btn">
            Subscribe Free Click Now &nbsp; 📲
        </a>

        <p class="disclaimer">
            Disclaimer: This channel shares cricket updates, analysis, and general information for fans. It does not promote betting or gambling. No outcomes are guaranteed.
        </p>
    </div>

    <script>
        let timeLeft = 15;
        const timerElement = document.getElementById('count');
        setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                timerElement.innerText = timeLeft;
            } else {
                timeLeft = 15; 
            }
        }, 1000);
    </script>
</body>
</html>
